<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ltv-logo-react demo</title>
    <style>
      body {
        margin: 0;
        padding: 24px 16px;
        font:
          15px/1.5 system-ui,
          sans-serif;
        background: #f7f7f5;
        color: #1d1d1b;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .row > div {
        width: 300px;
        height: 170px;
        display: grid;
        place-items: center;
        align-content: start;
        background: #fff;
        border: 1px solid #e4e4e0;
        border-radius: 12px;
        overflow: hidden;
      }
      p {
        margin: 4px 8px;
        font-family: ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <h1>ltv-logo-react</h1>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
